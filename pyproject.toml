[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opt-gamma"
version = "0.4.1"
description = "Optimized gamma inter-annotator agreement for free segmentation, complex labels and explicit relations (two annotators)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Malek Sefi" },
  { name = "Léo Nebel" },
  { name = "François Bouchet" },
]
keywords = [
  "inter-annotator agreement", "gamma", "annotation", "argument mining",
  "unitizing", "reliability", "kappa", "krippendorff",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = ["numpy>=1.22", "scipy>=1.8"]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
dev = ["pytest>=7", "pandas>=1.5", "ruff"]

[project.urls]
# Homepage = "https://github.com/<user>/opt-gamma"   # à compléter

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 95
